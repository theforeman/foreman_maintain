name: Ruby Tests
on: pull_request

jobs:
  rubocop:
    uses: theforeman/actions/.github/workflows/rubocop.yml@v1
    with:
      command: bundle exec rubocop --parallel --format github
  test_ruby:
    uses: theforeman/actions/.github/workflows/test-gem.yml@v1
    with:
      command: bundle exec rake test
